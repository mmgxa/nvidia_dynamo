# Grafana Alloy DaemonSet: one collector per node, tails pod logs, ships to Loki.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: alloy
  namespace: monitoring
  labels:
    app.kubernetes.io/name: alloy
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: alloy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alloy
    spec:
      serviceAccountName: alloy
      containers:
        - name: alloy
          image: docker.io/grafana/alloy:v1.19.0
          args:
            - run
            - --storage.path=/tmp/alloy
            - --server.http.listen-addr=0.0.0.0:12345
            - /etc/alloy/config.alloy
          ports:
            - name: http-metrics
              containerPort: 12345
          volumeMounts:
            - name: config
              mountPath: /etc/alloy
            - name: wal
              mountPath: /tmp/alloy
      volumes:
        - name: config
          configMap:
            name: alloy
        - name: wal
          emptyDir: {}
